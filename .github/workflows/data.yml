# Снимок данных для карты: TLE CelesTrak, каталог SATCAT и ближайшие запуски (Launch Library 2) публикуются в ветку data.
# Карта читает их через jsDelivr / raw.githack / raw.githubusercontent, поэтому посетители не нагружают CelesTrak.
name: data snapshot

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/data.yml', 'tools/data/**']

permissions:
  contents: write

concurrency:
  group: data-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Previous snapshot
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git --work-tree=out checkout FETCH_HEAD -- .
          fi

      - name: Fetch CelesTrak and Launch Library 2
        run: python3 tools/data/fetch_data.py out

      - name: Publish to data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name 'buran-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
